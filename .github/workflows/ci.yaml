name: CI — Build Docker Image

on:
  push:
    branches: [main, develop]
    paths: ['app/**']
  pull_request:
    branches: [main]
    paths: ['app/**']

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          # Ключ SA из terraform output registry_sa_secret_key
          password: ${{ secrets.YC_REGISTRY_SA_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (latest + sha)
        uses: docker/build-push-action@v5
        with:
          context: app/
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/diplom-app:latest
            cr.yandex/${{ secrets.YC_REGISTRY_ID }}/diplom-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
